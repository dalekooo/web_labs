<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Карточка игрока">
        <link rel="stylesheet" href="../visitka-style.css">
        <link rel="stylesheet" href="card.css">
        <link rel="icon" href="../favicon-16x16.png" type="image/png">
        <title>Карточка игрока</title>
    </head>
    <body>
        <header id="top">
            <p class="logo"><span>daleko</span></p>
            <nav>
                <a href="../index.html">&lt; на визитку</a>
            </nav>
        </header>
        <main>
            <article class="card" id="profile-card">
                <header class="card-header">
                    <div class="avatar-wrap">
                        <img class="avatar" src="avatar.svg" alt="Аватар игрока daleko" width="120" height="120">
                        <span class="status">online</span>
                    </div>
                    <h1 class="name">daleko</h1>
                    <p class="role">Игрок · 24 lvl</p>
                </header>

                <p class="bio">Люблю ретровейв, аркады и трансформеров. Изучаю веб, мечтаю вернуться к ассемблеру.</p>

                <dl class="stats">
                    <div class="stat">
                        <dt>Уровень</dt>
                        <dd>24</dd>
                    </div>
                    <div class="stat">
                        <dt>Рекорд</dt>
                        <dd>3816</dd>
                    </div>
                    <div class="stat">
                        <dt>Победы</dt>
                        <dd>28</dd>
                    </div>
                </dl>

                <ul class="tags">
                    <li>Out Run</li>
                    <li>Street Fighter II</li>
                    <li>Donkey Kong</li>
                    <li>Galaga</li>
                </ul>

                <div class="actions">
                    <a class="btn" href="#profile-card">Добавить в друзья</a>
                    <button class="btn btn-outline" type="button">Написать</button>
                </div>
            </article>
        </main>
        <footer id="contacts">
            <p><small>&copy; 2026 Дарья Лещенко. Лабораторная работа №3.</small></p>
        </footer>
    </body>
</html>
